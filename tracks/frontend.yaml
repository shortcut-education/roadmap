        description: Серверное состояние, кэш, инвалидация, фоновое обновление, мутации, оптимистичные обновления
        interview: "Чем серверное состояние отличается от клиентского; как работает инвалидация кэша; что даёт оптимистичное обновление."
        in_practice: TanStack Query решает загрузку и кэширование серверных данных — снимает большую часть ручной работы с запросами.
        min_grade: Middle-
        depends_on: [react.data-fetching]
        resources:
          - title: "TanStack Query Documentation"
            url: "https://tanstack.com/query/latest"
            type: official

