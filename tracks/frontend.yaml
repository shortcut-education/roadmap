        min_grade: Junior
        depends_on: [javascript.js-modules]
        resources:
          - title: "ESLint Documentation"
            url: "https://eslint.org/docs/latest/"
            type: official
      - id: prettier
        title: Prettier
        description: Автоформатирование, конфигурация, интеграция с ESLint и редактором, pre-commit hooks
        interview: "Чем Prettier отличается от ESLint; как их совместить без конфликтов; зачем нужен pre-commit."
        in_practice: Prettier убирает споры о форматировании и делает диффы чистыми — стандарт командной работы.
