        depends_on: [react.react-patterns]
        resources:
          - title: "Next.js Documentation"
            url: "https://nextjs.org/docs"
            type: official
          - title: "Next.js Roadmap"
            url: "https://roadmap.sh/react/nextjs"
            type: roadmap
