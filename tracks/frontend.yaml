      - id: testing-library
        title: Testing Library
        description: Тестирование компонентов от лица пользователя, queries, user-event, philosophy «test behavior not implementation»
        interview: "Почему Testing Library не даёт тестировать детали реализации; чем getByRole лучше getByTestId; что такое user-event."
        in_practice: Testing Library проверяет поведение UI так, как его видит пользователь — устойчивые к рефакторингу тесты.
        min_grade: Middle-
        depends_on: [jest-vitest, react.hooks]
        resources:
          - title: "Testing Library Documentation"
            url: "https://testing-library.com/"
            type: official
      - id: e2e
        title: E2E-тесты
        description: Playwright и Cypress, сквозные сценарии, селекторы, ожидания, фикстуры, CI-интеграция
        interview: "Чем e2e отличается от unit; как бороться с флаки-тестами; чем Playwright отличается от Cypress."
        in_practice: E2E проверяют реальные пользовательские сценарии целиком — уверенность перед релизом.
        min_grade: Middle-
        depends_on: [testing-library]

