        min_grade: Junior
        depends_on: [javascript.js-modules]
        resources:
          - title: "npm Documentation"
            url: "https://docs.npmjs.com/"
            type: official
      - id: yarn-pnpm
        title: Yarn и pnpm
        description: Отличия от npm, workspaces, symlink-подход pnpm, скорость, монорепозитории
        interview: "Чем pnpm экономит место на диске; что дают workspaces; чем Yarn отличается от npm."
        in_practice: pnpm/Yarn ускоряют установку и упрощают монорепозитории — частый выбор в командных проектах.
        min_grade: Junior
