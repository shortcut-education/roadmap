      - id: csrf
        title: CSRF
        description: Суть атаки, CSRF-токены, SameSite cookies, double submit, защита форм и запросов
        interview: "Как работает CSRF-атака; чем SameSite=Lax защищает; зачем нужен CSRF-токен при наличии SameSite."
        in_practice: Защита от CSRF нужна для аутентифицированных запросов, меняющих состояние.
        min_grade: Middle
        depends_on: [internet.http]
      - id: csp
        title: Content Security Policy
        description: CSP-заголовки, директивы (script-src, style-src), nonce/hash, report-only режим
        interview: "Что даёт CSP против XSS; чем nonce лучше unsafe-inline; как внедрять CSP постепенно."
        in_practice: CSP — сильный второй рубеж против XSS и инъекций; важен для продакшн-безопасности.
        min_grade: Middle
        depends_on: [xss]
      - id: https-owasp
        title: HTTPS и OWASP
        description: TLS, HSTS, mixed content, OWASP Top 10 для фронтенда, безопасное хранение токенов
        interview: "Что такое HSTS; чем опасен mixed content; где безопаснее хранить JWT — localStorage или cookie."
        in_practice: Знание OWASP Top 10 и корректная работа с HTTPS/токенами — базовая гигиена безопасного фронтенда.
        min_grade: Middle+
        depends_on: [csp]
        resources:
          - title: "OWASP Top Ten"
            url: "https://owasp.org/www-project-top-ten/"
            type: official

  - id: auth
    title: Аутентификация
    skills:
      - id: session-cookies
        title: Сессии и cookies
        description: Session-based auth, cookies (HttpOnly, Secure, SameSite), хранение сессии, срок жизни
        interview: "Чем HttpOnly-cookie безопаснее localStorage; что делает флаг Secure; как устроена session-based авторизация."
        in_practice: Куки-сессии — классический и безопасный способ авторизации; фронтендер должен понимать флаги cookies.
        min_grade: Middle-
        depends_on: [internet.http]
      - id: jwt
        title: JWT
        description: Структура токена (header/payload/signature), access/refresh, хранение, обновление, отзыв
        interview: "Из чего состоит JWT; чем access отличается от refresh; где хранить токен и как обновлять."
        in_practice: JWT — распространённый способ авторизации в SPA; правильное хранение и обновление критично для безопасности.
        min_grade: Middle-
        depends_on: [session-cookies]
      - id: oauth2
        title: OAuth 2.0 и OIDC
        description: Authorization Code Flow, PKCE, OpenID Connect, scopes, интеграция с провайдерами
        interview: "Как работает Authorization Code Flow; зачем нужен PKCE в SPA; чем OIDC отличается от OAuth."
        in_practice: OAuth/OIDC используются для входа через Google/GitHub/корпоративные SSO — стандарт делегированной авторизации.
        min_grade: Middle
        depends_on: [jwt]
      - id: sso-frontend
        title: SSO на фронтенде
        description: Single Sign-On, silent refresh, session management, интеграция с identity-провайдерами
        interview: "Как реализовать silent refresh; что такое SSO и его плюсы; как синхронизировать выход между вкладками."
        in_practice: SSO нужен в корпоративных и мультипродуктовых системах для единого входа между приложениями.
        min_grade: Middle
        depends_on: [oauth2]

  - id: web-apis
    title: Web APIs и компоненты
    skills:
      - id: web-storage
        title: Web Storage
        description: localStorage, sessionStorage, cookies, IndexedDB, ограничения и безопасность хранения
        interview: "Чем localStorage отличается от sessionStorage; когда нужен IndexedDB; почему нельзя хранить токены в localStorage."
        in_practice: Клиентское хранилище нужно для кэша, настроек, офлайна; выбор хранилища влияет на UX и безопасность.
        min_grade: Junior+
        depends_on: [javascript.js-syntax]
        resources:
          - title: "Web Storage API — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API"
            type: official
      - id: web-components
        title: Web Components
        description: Custom Elements, жизненный цикл, HTML templates, слоты, использование вне фреймворков
        interview: "Что входит в стандарт Web Components; чем custom element отличается от React-компонента; где применимы."
        in_practice: Web Components дают переиспользуемые UI-элементы без привязки к фреймворку — дизайн-системы, виджеты.
        min_grade: Middle-
        depends_on: [javascript.dom]
      - id: shadow-dom
        title: Shadow DOM
        description: Инкапсуляция стилей и разметки, shadow root, слоты, влияние на CSS
        interview: "Как Shadow DOM изолирует стили; что такое shadow root; как стилизовать содержимое извне."
        in_practice: Shadow DOM изолирует внутренности компонента от глобальных стилей — надёжные встраиваемые виджеты.
        min_grade: Middle
        depends_on: [web-components]
      - id: service-workers
        title: Service Workers
        description: Регистрация, жизненный цикл, перехват запросов, кэш-стратегии, фоновая синхронизация, push
        interview: "Что умеет Service Worker; какие бывают стратегии кэширования; чем отличается от Web Worker."
        in_practice: Service Workers дают офлайн-режим, кэширование и push-уведомления — основа PWA.
        min_grade: Middle
        depends_on: [web-storage, javascript.async-await]
      - id: pwa
        title: Progressive Web Apps
        description: Manifest, установка, офлайн, push-уведомления, app-like опыт, критерии установки
        interview: "Что делает сайт устанавливаемым как PWA; за что отвечает manifest; как обеспечить офлайн."
        in_practice: PWA приближают веб к нативным приложениям — установка, офлайн, уведомления без магазинов приложений.
        min_grade: Middle+
        depends_on: [service-workers]
        resources:
          - title: "Progressive web apps — web.dev"
            url: "https://web.dev/explore/progressive-web-apps"
            type: article
      - id: websockets
        title: WebSockets и real-time
        description: WebSocket API, реальное время, отличие от HTTP-поллинга, Server-Sent Events, reconnection
        interview: "Чем WebSocket отличается от HTTP; когда выбрать SSE вместо WebSocket; как обрабатывать переподключение."
        in_practice: Real-time нужен для чатов, нотификаций, live-обновлений; WebSocket — основной транспорт двусторонней связи.
        min_grade: Middle
        depends_on: [javascript.async-await]

  - id: graphql
    title: GraphQL
    skills:
      - id: graphql-basics
        title: Основы GraphQL
        description: Схема, queries, mutations, subscriptions, типы, отличие от REST, over/under-fetching
        interview: "Какую проблему REST решает GraphQL; что такое over-fetching; чем query отличается от mutation."
        in_practice: GraphQL позволяет запрашивать ровно нужные данные одним запросом — удобно для сложных UI.
        min_grade: Middle
        depends_on: [javascript.fetch-ajax]
        resources:
          - title: "Introduction to GraphQL"
            url: "https://graphql.org/learn/"
            type: official
          - title: "GraphQL Roadmap"
            url: "https://roadmap.sh/graphql"
            type: roadmap
      - id: apollo
        title: Apollo Client
        description: Клиент, кэш (normalized cache), хуки (useQuery/useMutation), политики кэша, оптимистичные обновления
        interview: "Как устроен нормализованный кэш Apollo; чем useQuery удобнее ручного fetch; как работает оптимистичный апдейт."
        in_practice: Apollo Client — самый распространённый способ работать с GraphQL в React с кэшем и хуками из коробки.
        min_grade: Middle
        depends_on: [graphql-basics, react.data-fetching]
      - id: relay
        title: Relay
        description: Компилятор, фрагменты, colocation данных, пагинация (connections), строгие требования к схеме
        interview: "Чем Relay отличается от Apollo; что даёт colocation фрагментов; как Relay обрабатывает пагинацию."
        in_practice: Relay оптимизирован под крупные приложения со строгой типизацией данных; ниша, но важен для масштаба.
        min_grade: Middle+
        depends_on: [apollo]

  - id: performance
    title: Производительность
    skills:
      - id: core-web-vitals
        title: Core Web Vitals
        description: LCP, INP, CLS, метрики загрузки и отзывчивости, поле vs лаборатория, влияние на SEO
        interview: "Что измеряют LCP, INP и CLS; чем полевые данные отличаются от лабораторных; как улучшить CLS."
        in_practice: Core Web Vitals напрямую влияют на UX и ранжирование в поиске — ключевые метрики продакшна.
        min_grade: Middle-
        depends_on: [internet.how-browsers-work]
        resources:
          - title: "Web Vitals — web.dev"
            url: "https://web.dev/articles/vitals"
            type: article
      - id: lighthouse
        title: Lighthouse и профилирование
        description: Lighthouse, DevTools Performance, аудит, waterfall, поиск узких мест, RUM
        interview: "Что показывает вкладка Performance в DevTools; чем RUM отличается от синтетики; как читать waterfall."
        in_practice: Профилирование находит реальные узкие места вместо догадок — основа осознанной оптимизации.
        min_grade: Middle-
        depends_on: [core-web-vitals]
      - id: code-splitting
        title: Code splitting
        description: Динамические импорты, разбиение бандла по маршрутам, ленивая загрузка компонентов, chunk-стратегии
        interview: "Как работает code splitting; чем route-based splitting лучше; как измерить эффект на размер бандла."
        in_practice: Разбиение кода снижает начальный вес приложения и ускоряет первую загрузку.
        min_grade: Middle-
        depends_on: [javascript.js-modules]
      - id: lazy-loading
        title: Ленивая загрузка ресурсов
        description: loading=lazy для изображений, ленивые компоненты, prefetch/preload, приоритеты ресурсов
        interview: "Как лениво грузить изображения нативно; чем preload отличается от prefetch; когда вредна ленивая загрузка."
        in_practice: Ленивая загрузка откладывает несрочные ресурсы, ускоряя видимую часть страницы.
        min_grade: Middle-
        depends_on: [code-splitting]
      - id: caching-cdn
        title: Кэширование и CDN
        description: HTTP-кэш, immutable-ассеты и хэши в именах, CDN, стратегии инвалидации, service worker cache
        interview: "Как работает кэш через Cache-Control; зачем хэши в именах файлов; как инвалидировать кэш при релизе."
        in_practice: Кэширование и CDN резко ускоряют повторные загрузки и снижают нагрузку — стандарт продакшн-раздачи.
        min_grade: Middle
        depends_on: [internet.http, code-splitting]

  - id: cross-platform
    title: Кроссплатформенная разработка
    skills:
      - id: react-native
        title: React Native
        description: Мобильные приложения на React, нативные компоненты, навигация, доступ к устройству, Expo
        interview: "Как React Native рендерит нативные компоненты; чем отличается от React для веба; что даёт Expo."
        in_practice: React Native позволяет переиспользовать навыки React для iOS/Android — быстрый вход в мобильную разработку.
        min_grade: Middle
        depends_on: [react.react-patterns]
        resources:
          - title: "React Native Documentation"
            url: "https://reactnative.dev/"
            type: official
      - id: electron
        title: Electron
        description: Десктоп-приложения на веб-технологиях, main/renderer процессы, IPC, доступ к ОС, вес приложения
        interview: "Как устроены main и renderer процессы; чем Electron платит за кроссплатформенность; как работает IPC."
        in_practice: Electron даёт десктоп-приложения на знакомом стеке (VS Code, Slack); подходит для внутренних инструментов.
        min_grade: Middle+
        depends_on: [react.react-patterns]
      - id: tauri
        title: Tauri
        description: Лёгкая альтернатива Electron на Rust, системный webview, малый размер, безопасность
        interview: "Чем Tauri легче Electron; почему используется системный webview; какие компромиссы у подхода."
        in_practice: Tauri даёт десктоп-приложения с малым размером и низким потреблением памяти — современная альтернатива Electron.
        min_grade: Senior
        depends_on: [electron]
      - id: ionic
        title: Ionic
        description: Гибридные мобильные приложения, web-компоненты, Capacitor, доступ к нативным API
        interview: "Чем гибридное приложение отличается от нативного; что даёт Capacitor; когда Ionic оправдан."
        in_practice: Ionic позволяет собрать мобильное приложение из веб-стека с доступом к нативным возможностям через Capacitor.
        min_grade: Middle+
        depends_on: [web-apis.web-components]
