        interview: "Что означает ^1.2.3; чем ~ отличается от ^; когда повышают MAJOR."
        in_practice: Понимание semver предотвращает неожиданные breaking changes при обновлении зависимостей.
        min_grade: Junior
        depends_on: [npm]

  - id: react
    title: React
    skills:
      - id: jsx-components
        title: JSX и компоненты
        description: JSX-синтаксис, функциональные компоненты, композиция, фрагменты, условный рендеринг, списки и key
        interview: "Во что компилируется JSX; зачем нужен key в списках; чем компонент отличается от элемента."
        in_practice: Компоненты — базовая единица React; композиция определяет всю архитектуру UI.
        min_grade: Junior
        depends_on: [javascript.es6-plus]
        resources:
          - title: "React Documentation (react.dev)"
            url: "https://react.dev/learn"
            type: official
          - title: "React Roadmap"
            url: "https://roadmap.sh/react"
            type: roadmap
      - id: props-state
        title: Пропсы и состояние
        description: props, однонаправленный поток данных, useState, иммутабельность, подъём состояния (lifting state up)
        interview: "Почему нельзя мутировать state напрямую; что такое подъём состояния; чем props отличается от state."
        in_practice: Управление состоянием и передача данных через пропсы — основа любого React-приложения.
        min_grade: Junior
        depends_on: [jsx-components]
      - id: hooks
        title: Хуки
        description: >
          useState, useEffect, useRef, useMemo, useCallback, useReducer,
          правила хуков, зависимости эффектов, кастомные хуки
        interview: "Как работает массив зависимостей useEffect; когда нужен useMemo/useCallback; правила хуков и почему их нельзя нарушать."
        in_practice: "Хуки — основной API современного React: состояние, побочные эффекты, оптимизация, переиспользование логики."
        min_grade: Junior+
        depends_on: [props-state]
        resources:
          - title: "React Hooks Reference"
            url: "https://react.dev/reference/react/hooks"
            type: official
      - id: context
        title: Context API
        description: createContext, Provider, useContext, когда использовать вместо пропсов, ограничения и ре-рендеры
        interview: "Какую проблему решает Context; почему Context может вызывать лишние ре-рендеры; когда лучше внешний стор."
        in_practice: "Context передаёт данные без prop drilling: тема, локаль, авторизованный пользователь."
        min_grade: Junior+
        depends_on: [hooks]
      - id: react-router
        title: Маршрутизация
        description: React Router, декларативные маршруты, вложенные роуты, параметры, программная навигация, lazy-маршруты
        interview: "Как устроены вложенные маршруты; чем useNavigate отличается от Link; как сделать защищённый роут."
        in_practice: Маршрутизация превращает SPA в многостраничное приложение с адресуемыми экранами.
        min_grade: Junior+
        depends_on: [hooks]
      - id: data-fetching
        title: Загрузка данных
        description: Запросы в эффектах, состояния loading/error, отмена, кэширование, паттерны data fetching, интеграция с TanStack Query
        interview: "Какие проблемы у fetch в useEffect; зачем нужна библиотека для запросов; как обрабатывать race conditions."
        in_practice: Почти каждое приложение загружает данные с сервера; правильные паттерны убирают гонки и лишние запросы.
        min_grade: Middle-
        depends_on: [hooks, javascript.fetch-ajax]
      - id: suspense
        title: Suspense и Concurrent React
        description: Suspense, lazy, transitions (useTransition/useDeferredValue), streaming, Error Boundaries
        interview: "Что делает Suspense; зачем нужен useTransition; как работает Error Boundary."
        in_practice: Suspense и concurrent-возможности улучшают UX при загрузке и тяжёлых обновлениях без блокировки интерфейса.
        min_grade: Middle
        depends_on: [data-fetching]
      - id: react-patterns
        title: Паттерны и архитектура
        description: >
          Компонентная архитектура, композиция vs наследование, container/presentational,
          compound components, render props, HOC, разделение ответственности
        interview: "Чем композиция лучше наследования в React; что такое compound components; когда оправдан HOC."
        in_practice: Паттерны определяют поддерживаемость крупного приложения — переиспользование, тестируемость, чистые границы.
        min_grade: Middle
        depends_on: [context]

