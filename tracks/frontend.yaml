      - id: zustand
        title: Zustand
        description: Минималистичный стор, хуки-селекторы, middleware, отсутствие boilerplate, сравнение с Redux
        interview: "Чем Zustand проще Redux; как избежать лишних ре-рендеров через селекторы; когда Zustand достаточно."
        in_practice: Zustand даёт глобальное состояние с минимумом кода — популярный выбор для средних приложений.
