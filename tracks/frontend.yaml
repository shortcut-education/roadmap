        title: Nuxt
        description: SSR-метафреймворк для Vue, файловый роутинг, автоимпорты, модули, рендер-режимы
        interview: "Что даёт Nuxt поверх Vue; чем универсальный рендеринг отличается от SPA; как устроен файловый роутинг."
