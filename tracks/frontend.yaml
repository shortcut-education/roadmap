id: frontend
title: Frontend Developer
description: Карта навыков frontend-разработчика
icon: "🎨"
grades: [Intern, Junior, Junior+, Middle-, Middle, Middle+, Senior]

includes:
  - common/infra

categories:
  - id: internet
    title: Интернет и веб
    skills:
      - id: how-internet-works
        title: Как работает интернет
        description: Клиент-серверная модель, IP, TCP/IP, порты, что происходит при вводе URL в браузере
        interview: "Что происходит от момента ввода example.com до отрисовки страницы; чем TCP отличается от UDP; зачем нужны порты."
        in_practice: Базовое понимание сети нужно для отладки запросов, настройки CORS, деплоя и работы с API.
        min_grade: Intern
        depends_on: []
        resources:
          - title: "How does the Internet Work? — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Learn/Common_questions/Web_mechanics/How_does_the_Internet_work"
            type: article
          - title: "Как работает интернет — learn.javascript.ru раздел / Habr"
            url: "https://habr.com/ru/articles/427721/"
            type: article
      - id: http
        title: HTTP и HTTPS
        description: Методы, статус-коды, заголовки, cookies, кэширование, HTTPS/TLS, HTTP/2 и HTTP/3
        interview: "Какие методы идемпотентны; чем отличаются 301 и 302; что делает TLS handshake; зачем нужен заголовок Cache-Control."
        in_practice: Каждый запрос к API — это HTTP. Понимание методов, кодов и заголовков критично для интеграции с бэкендом и отладки.
        min_grade: Intern
        depends_on: [how-internet-works]
        resources:
          - title: "HTTP — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/HTTP"
            type: official
          - title: "Full Stack HTTP — roadmap.sh"
            url: "https://roadmap.sh/guides/http-caching"
            type: roadmap
          - title: "Протокол HTTP — doka.guide"
            url: "https://doka.guide/tools/http-request/"
            type: article
      - id: dns
        title: DNS
        description: Как работает разрешение имён, типы записей (A, AAAA, CNAME, MX, TXT), TTL, resolver
        interview: "Что происходит при DNS-запросе; чем A отличается от CNAME; зачем нужен TTL."
        in_practice: Настройка доменов, поддоменов, переезд на новый хостинг, отладка «сайт не открывается».
        min_grade: Junior
        depends_on: [how-internet-works]
        resources:
          - title: "What is DNS? — Cloudflare Learning"
            url: "https://www.cloudflare.com/learning/dns/what-is-dns/"
            type: article
      - id: domain-hosting
        title: Домены и хостинг
        description: Регистрация доменов, DNS-провайдеры, виды хостинга, статический хостинг (Netlify, Vercel, GitHub Pages), CDN
        interview: "Чем статический хостинг отличается от серверного; что даёт CDN; как задеплоить SPA."
        in_practice: Деплой фронтенд-приложений, выбор хостинга под SPA/SSR, раздача статики через CDN.
        min_grade: Junior
        depends_on: [dns]
      - id: how-browsers-work
        title: Как работают браузеры
        description: >
          Рендеринг-движок, парсинг HTML/CSS, DOM/CSSOM, render tree, layout,
          paint, composite, критический путь рендеринга, event loop в браузере
        interview: "Что такое reflow и repaint; как строится render tree; чем layout отличается от paint; как event loop работает в браузере."
        in_practice: Понимание рендеринга — фундамент оптимизации производительности и отладки визуальных проблем.
        min_grade: Junior+
        depends_on: [http]
        resources:
          - title: "How browsers work — web.dev"
            url: "https://web.dev/articles/howbrowserswork"
            type: article
          - title: "Как работают браузеры — doka.guide"
            url: "https://doka.guide/js/how-browser-render-web-page/"
            type: article

  - id: html
    title: HTML
    skills:
      - id: html-basics
        title: Основы HTML
        description: Структура документа, теги, атрибуты, вложенность, блочные и строчные элементы, метатеги
        interview: "Чем блочный элемент отличается от строчного; зачем нужен DOCTYPE; что делают метатеги viewport и charset."
        in_practice: HTML — скелет любой страницы. Без корректной разметки не работают стили, скрипты и доступность.
        min_grade: Intern
        depends_on: []
        resources:
          - title: "HTML — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/HTML"
            type: official
          - title: "Учебник HTML — HTML Academy"
            url: "https://htmlacademy.ru/tutorial/html"
            type: article
      - id: semantic-html
        title: Семантическая вёрстка
        description: Семантические теги (header, nav, main, article, section, aside, footer), их роль для SEO и доступности
        interview: "Зачем нужна семантика вместо div-супа; чем article отличается от section; как семантика влияет на скринридеры."
        in_practice: Семантика улучшает SEO, доступность и читаемость кода — стандарт качественной вёрстки.
        min_grade: Junior
        depends_on: [html-basics]
        resources:
          - title: "HTML Semantic Elements — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Glossary/Semantics"
            type: official
      - id: forms-validation
        title: Формы и валидация
        description: Элементы форм, типы input, атрибуты валидации, Constraint Validation API, отправка данных
        interview: "Какие есть способы валидации на клиенте; чем novalidate полезен; как работает Constraint Validation API."
        in_practice: "Формы — основной канал ввода данных: регистрация, оплата, поиск. Валидация снижает количество ошибок."
        min_grade: Junior
        depends_on: [html-basics]
      - id: accessibility
        title: Доступность (a11y)
        description: ARIA-роли и атрибуты, семантика, навигация с клавиатуры, контраст, скринридеры, WCAG
        interview: "Что такое ARIA и когда её применять; как обеспечить навигацию с клавиатуры; что проверяет WCAG."
        in_practice: Доступность — требование закона в ряде стран и признак зрелого продукта; расширяет аудиторию.
        min_grade: Junior+
        depends_on: [semantic-html]
        resources:
          - title: "Accessibility — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/Accessibility"
            type: official
          - title: "Доступность интерфейсов — doka.guide"
            url: "https://doka.guide/a11y/"
            type: article
      - id: seo-basics
        title: Основы SEO
        description: Метатеги, семантика, sitemap, robots.txt, Open Graph, структурированные данные (schema.org), скорость загрузки
        interview: "Как семантика влияет на SEO; зачем нужны Open Graph-теги; как скорость влияет на ранжирование."
        in_practice: SEO влияет на органический трафик; фронтендер отвечает за техническую часть — разметку, метатеги, производительность.
        min_grade: Junior+
        depends_on: [semantic-html]

  - id: css
    title: CSS
    skills:
      - id: css-basics
        title: Основы CSS
        description: Селекторы, специфичность, каскад, наследование, единицы измерения (px, em, rem, %, vw/vh), цвета
        interview: "Как считается специфичность селектора; чем rem отличается от em; что такое каскад."
        in_practice: CSS определяет внешний вид всего интерфейса — основа ежедневной работы фронтендера.
        min_grade: Intern
        depends_on: [html.html-basics]
        resources:
          - title: "CSS — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/CSS"
            type: official
          - title: "Учебник CSS — HTML Academy"
            url: "https://htmlacademy.ru/tutorial/css"
            type: article
      - id: box-model
        title: Блочная модель
        description: content, padding, border, margin, box-sizing, схлопывание отступов
        interview: "Что делает box-sizing: border-box; что такое схлопывание margin; как считается итоговая ширина элемента."
        in_practice: Блочная модель определяет размеры и отступы всех элементов — источник большинства «поехавших» макетов.
        min_grade: Intern
        depends_on: [css-basics]
      - id: flexbox
        title: Flexbox
        description: flex-контейнер и элементы, main/cross axis, justify-content, align-items, flex-grow/shrink/basis, wrap
        interview: "Чем main axis отличается от cross axis; что делает flex: 1; как выровнять элемент по центру через flexbox."
        in_practice: "Flexbox — основной инструмент одномерных раскладок: навбары, карточки, выравнивание элементов."
        min_grade: Junior
        depends_on: [box-model]
        resources:
          - title: "A Complete Guide to Flexbox — CSS-Tricks"
            url: "https://css-tricks.com/snippets/css/a-guide-to-flexbox/"
            type: article
          - title: "Flexbox — doka.guide"
            url: "https://doka.guide/css/flexbox-guide/"
            type: article
      - id: grid
        title: CSS Grid
        description: grid-контейнер, строки/колонки, grid-template, fr, auto-fill/auto-fit, grid-area, выравнивание
        interview: "Когда Grid лучше Flexbox; что делает minmax(); чем fr отличается от %; как работает auto-fill."
        in_practice: "Grid — инструмент двумерных раскладок: сложные сетки, дашборды, галереи."
        min_grade: Junior
        depends_on: [flexbox]
        resources:
          - title: "A Complete Guide to Grid — CSS-Tricks"
            url: "https://css-tricks.com/snippets/css/complete-guide-grid/"
            type: article
          - title: "CSS Grid — doka.guide"
            url: "https://doka.guide/css/grids/"
            type: article
      - id: responsive
        title: Адаптивная вёрстка
        description: Media queries, mobile-first, гибкие единицы, responsive images (srcset), container queries
        interview: "Что такое mobile-first; чем container queries отличаются от media queries; как отдавать разные картинки под экраны."
        in_practice: Адаптив обязателен — большая часть трафика мобильная; одна вёрстка должна работать на всех экранах.
        min_grade: Junior+
        depends_on: [grid]
      - id: positioning
        title: Позиционирование
        description: static, relative, absolute, fixed, sticky, z-index, stacking context
        interview: "Чем absolute отличается от fixed; как работает sticky; что создаёт stacking context; почему z-index не всегда работает."
        in_practice: Позиционирование нужно для модалок, тултипов, выпадающих меню, липких шапок.
        min_grade: Junior+
        depends_on: [box-model]
      - id: animations
        title: Анимации и переходы
        description: transition, animation, @keyframes, transform, will-change, производительность анимаций
        interview: "Почему transform и opacity дешевле для анимации; что делает will-change; чем transition отличается от animation."
        in_practice: Анимации улучшают UX и обратную связь интерфейса; важно не ронять производительность.
        min_grade: Middle-
        depends_on: [positioning]

  - id: css-tools
    title: Написание CSS
    skills:
      - id: sass
        title: Sass / SCSS
        description: Переменные, вложенность, миксины, функции, partials, @use/@forward
        interview: "Что даёт Sass поверх CSS; чем миксин отличается от placeholder; зачем нужны partials."
        in_practice: "Препроцессоры упрощают поддержку больших стилей: переиспользование, темизация, модульность."
        min_grade: Junior
        depends_on: [css.css-basics]
        resources:
          - title: "Sass Documentation"
            url: "https://sass-lang.com/documentation/"
            type: official
      - id: postcss
        title: PostCSS и Autoprefixer
        description: PostCSS-плагины, Autoprefixer, современные CSS-фичи через транспиляцию, интеграция со сборкой
        interview: "Зачем нужен Autoprefixer; чем PostCSS отличается от препроцессора; как встроить PostCSS в сборку."
        in_practice: PostCSS добавляет вендорные префиксы и полифилы автоматически — кроссбраузерность без ручной работы.
        min_grade: Middle-
        depends_on: [sass]
      - id: bem
        title: Методология BEM
        description: Block, Element, Modifier, соглашения именования, изоляция стилей, масштабируемость
        interview: "Что решает BEM; как именовать модификатор; чем BEM помогает в больших проектах."
        in_practice: BEM даёт предсказуемые имена классов и изоляцию — стандарт в командной вёрстке без CSS-in-JS.
        min_grade: Junior
        depends_on: [css.css-basics]
        resources:
          - title: "Методология BEM"
            url: "https://ru.bem.info/methodology/"
            type: official
      - id: tailwind
        title: Tailwind CSS
        description: Utility-first подход, конфигурация, кастомизация темы, JIT, @apply, плагины
        interview: "В чём идея utility-first; плюсы и минусы Tailwind против BEM; что делает JIT-компилятор."
        in_practice: Tailwind ускоряет вёрстку без переключения контекста между HTML и CSS; популярен в React-экосистеме.
        min_grade: Junior+
        depends_on: [css.responsive]
        resources:
          - title: "Tailwind CSS Documentation"
            url: "https://tailwindcss.com/docs"
            type: official
      - id: css-modules
        title: CSS Modules
        description: Локальная область видимости классов, composes, интеграция со сборщиками, хэширование имён
        interview: "Как CSS Modules изолируют стили; чем отличаются от глобального CSS; что делает composes."
        in_practice: CSS Modules убирают конфликты имён классов в компонентных приложениях без рантайм-оверхеда.
        min_grade: Junior+
        depends_on: [css.css-basics]
      - id: css-in-js
        title: CSS-in-JS
        description: styled-components, Emotion, динамические стили, темизация, критика и производительность, zero-runtime (Linaria, vanilla-extract)
        interview: "Плюсы и минусы CSS-in-JS; чем zero-runtime решения лучше; как работает темизация в styled-components."
        in_practice: CSS-in-JS связывает стили с компонентами и позволяет динамические стили от пропсов; распространён в React.
        min_grade: Middle-
        depends_on: [css-modules]

  - id: javascript
    title: JavaScript
    skills:
      - id: js-syntax
        title: Основы синтаксиса
        description: >
          Переменные (let/const/var), типы данных, операторы, приведение типов,
          функции, области видимости, hoisting, замыкания
        interview: "Чем let отличается от var; что такое hoisting; как работает замыкание; чем == отличается от ===."
        in_practice: "Синтаксис — фундамент любой логики на фронте: обработчики, трансформации данных, интеграция с API."
        min_grade: Intern
        depends_on: [html.html-basics]
        resources:
          - title: "JavaScript — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript"
            type: official
          - title: "Современный учебник JavaScript — learn.javascript.ru"
            url: "https://learn.javascript.ru/"
            type: article
      - id: dom
        title: DOM
        description: Дерево DOM, поиск элементов, изменение, создание/удаление узлов, атрибуты, классы, стили
        interview: "Чем querySelector отличается от getElementById; как эффективно вставлять много узлов; что такое DocumentFragment."
        in_practice: Манипуляция DOM — основа интерактивности до фреймворков и под капотом каждого из них.
        min_grade: Intern
        depends_on: [js-syntax]
        resources:
          - title: "Document Object Model (DOM) — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model"
            type: official
          - title: "Документ и объекты страницы — learn.javascript.ru"
            url: "https://learn.javascript.ru/document"
            type: article
      - id: events
        title: События
        description: Обработчики, всплытие и погружение, делегирование, event.target/currentTarget, preventDefault, custom events
        interview: "Как работает всплытие; что такое делегирование событий и зачем оно нужно; чем target отличается от currentTarget."
        in_practice: "События — основа интерактивности: клики, ввод, скролл. Делегирование экономит память на списках."
        min_grade: Junior
        depends_on: [dom]
      - id: fetch-ajax
        title: Fetch и работа с сетью
        description: Fetch API, промисы запросов, заголовки, JSON, обработка ошибок, AbortController, XMLHttpRequest (legacy)
        interview: "Почему fetch не реджектит на 404; как отменить запрос; чем fetch лучше XMLHttpRequest."
        in_practice: Любое взаимодействие с бэкендом идёт через сетевые запросы — загрузка данных, отправка форм, поллинг.
        min_grade: Junior
        depends_on: [async-await]
        resources:
          - title: "Fetch API — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API"
            type: official
      - id: es6-plus
        title: Современный JavaScript (ES6+)
        description: >
          Стрелочные функции, деструктуризация, spread/rest, шаблонные строки,
          опциональная цепочка, nullish coalescing, итераторы, Map/Set, Symbol
        interview: "Чем стрелочная функция отличается по this; как работает деструктуризация с дефолтами; что делает ?. и ??."
        in_practice: Современный синтаксис — стандарт кодовых баз; фреймворки и линтеры предполагают знание ES6+.
        min_grade: Junior
        depends_on: [js-syntax]
      - id: async-await
        title: Асинхронность
        description: Callbacks, промисы, async/await, event loop, микро- и макрозадачи, Promise.all/race/allSettled
        interview: "Как работает event loop; чем микрозадача отличается от макрозадачи; в каком порядке выполнятся then и setTimeout."
        in_practice: "Асинхронность повсюду: запросы, таймеры, анимации. Понимание event loop критично для отладки гонок."
        min_grade: Junior+
        depends_on: [es6-plus]
        resources:
          - title: "Промисы, async/await — learn.javascript.ru"
            url: "https://learn.javascript.ru/async"
            type: article
          - title: "Concurrency model and Event Loop — MDN"
            url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Event_loop"
            type: official
      - id: js-modules
        title: Модули
        description: ES Modules (import/export), CommonJS, динамический import(), tree-shaking, области видимости модулей
        interview: "Чем ES Modules отличаются от CommonJS; как работает динамический import; что такое tree-shaking."
        in_practice: Модульность — основа структуры кода и оптимизации бандла через tree-shaking.
        min_grade: Junior+
        depends_on: [es6-plus]

  - id: typescript
    title: TypeScript
    skills:
      - id: ts-basics
        title: Основы TypeScript
        description: Аннотации типов, вывод типов (inference), primitives (string/number/boolean), зачем нужна статическая типизация
        interview: "Что даёт TypeScript поверх JS; как работает вывод типов; нужно ли аннотировать всё явно."
        in_practice: TypeScript ловит ошибки до рантайма и улучшает автокомплит — стандарт в современных фронтенд-проектах.
        min_grade: Junior
        depends_on: [javascript.js-syntax]
        resources:
          - title: "TypeScript Handbook"
            url: "https://www.typescriptlang.org/docs/handbook/intro.html"
            type: official
          - title: "TypeScript Roadmap"
            url: "https://roadmap.sh/typescript"
            type: roadmap
          - title: "TypeScript — doka.guide"
            url: "https://doka.guide/js/typescript-intro/"
            type: article
      - id: ts-types
        title: Базовые типы
        description: any/unknown/never/void, массивы, tuples, enums, object types, литеральные типы
        interview: "Чем unknown отличается от any; когда возникает never; чем enum отличается от union литералов."
        in_practice: Правильные базовые типы — фундамент типобезопасности; any обесценивает всю систему типов.
        min_grade: Junior
        depends_on: [ts-basics]
      - id: ts-system
        title: Система типов
        description: union и intersection типы, type aliases vs interfaces, литеральные типы, структурная типизация
        interview: "Чем type отличается от interface; что такое структурная типизация; когда использовать union, а когда intersection."
        in_practice: Комбинирование типов позволяет точно описывать контракты данных и API-ответы.
        min_grade: Junior+
        depends_on: [ts-types]
      - id: ts-narrowing
        title: Сужение типов и type guards
        description: typeof/instanceof/in, discriminated unions, пользовательские type guards, assertion functions, control flow analysis
        interview: "Как TS сужает тип в ветке if; что такое discriminated union; как написать пользовательский type guard."
        in_practice: Сужение типов делает работу с union безопасной — обработка разных вариантов ответа API без any.
        min_grade: Junior+
        depends_on: [ts-system]
      - id: ts-functions
        title: Типизация функций
        description: Типы параметров и возврата, опциональные и default параметры, перегрузки, this-типы, типы колбэков
        interview: "Как типизировать функцию высшего порядка; зачем нужны перегрузки; как типизировать this."
        in_practice: Функции — основной строительный блок; корректные сигнатуры дают безопасность и автокомплит на вызовах.
        min_grade: Junior+
        depends_on: [ts-types]
      - id: ts-generics
        title: Дженерики
        description: Дженерик-функции, constraints (extends), дженерик-классы и интерфейсы, дефолтные типы-параметры
        interview: "Зачем нужны дженерики; как ограничить дженерик через extends; приведите пример дженерик-функции."
        in_practice: "Дженерики позволяют писать переиспользуемый типобезопасный код: хелперы, хуки, компоненты, API-клиенты."
        min_grade: Middle-
        depends_on: [ts-system]
      - id: ts-advanced
        title: Продвинутые типы
        description: >
          Mapped types, conditional types, utility types (Partial/Pick/Omit/Record/Required),
          keyof/typeof, template literal types, infer
        interview: "Как работает Partial под капотом; что делает keyof; как устроен conditional type с infer."
        in_practice: Продвинутые типы описывают сложные трансформации данных и дают типобезопасность там, где обычных типов мало.
        min_grade: Middle
        depends_on: [ts-generics]
      - id: ts-config
        title: tsconfig и компилятор
        description: tsconfig.json, strict mode, ключевые опции компилятора, target/module, ts-node, tsc
        interview: "Что включает strict mode; чем target отличается от module; зачем нужен noUncheckedIndexedAccess."
        in_practice: Правильный tsconfig задаёт уровень строгости всего проекта; strict ловит больше ошибок.
        min_grade: Junior+
        depends_on: [ts-basics]
      - id: ts-ecosystem
        title: Экосистема и интеграция
        description: Declaration files (.d.ts), @types/DefinitelyTyped, типизация React (props, hooks), интеграция со сборкой и линтингом
        interview: "Зачем нужны .d.ts файлы; как подключить типы для нетипизированной библиотеки; как типизировать React-компонент."
        in_practice: Реальные проекты используют TS в связке с React и сборщиками; знание экосистемы обязательно для работы.
        min_grade: Middle-
        depends_on: [ts-config]

